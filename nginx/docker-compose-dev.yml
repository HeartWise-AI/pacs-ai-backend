services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile-dev
    container_name: nginx
    restart: unless-stopped
    env_file: .env
    ports:
      # /orthanc/ proxies the unauthenticated Orthanc REST API; keep it loopback-only.
      - 127.0.0.1:80:80
    depends_on:
      - orthanc
      - api-pacs
