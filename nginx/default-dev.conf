# Resolve Docker service names per request (Docker embedded DNS) instead of
# once at startup, so recreated containers with new IPs keep working without
# an nginx reload. Variables in proxy_pass force runtime resolution.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
	listen 80;
	client_header_timeout 10s;
	client_body_timeout 30s;
	keepalive_timeout 75s;

	set $api_upstream api-pacs:8000;
	set $orthanc_upstream orthanc:8042;
	set $orthanc_hospital_1_upstream orthanc-hospital-1-query:8042;
	set $orthanc_hospital_2_upstream orthanc-hospital-2:8042;

	error_page 413 = @request_body_too_large;
	location @request_body_too_large {
		default_type application/json;
		return 413 '{"success":false,"message":"Request body is too large.","errorCode":"REQUEST_BODY_TOO_LARGE","data":{}}';
	}

	location /api/proxy/orthanc/dicom-web/ {
		# Variable proxy_pass does not replace the location prefix; strip /api.
		rewrite ^/api(/proxy/orthanc/dicom-web/.*)$ $1 break;
		proxy_pass http://$api_upstream;
		proxy_set_header Host $http_host;
		proxy_request_buffering off;
		proxy_max_temp_file_size 0;
		client_max_body_size ${NGINX_DICOMWEB_MAX_BODY_SIZE};
		proxy_connect_timeout 300;
		proxy_send_timeout 300;
		proxy_read_timeout 300;
		send_timeout 300;
	}

	location /api/ {
		# Same as the former `proxy_pass http://api-pacs:8000/;`: strip /api.
		rewrite ^/api(/.*)$ $1 break;
		proxy_pass http://$api_upstream;
		proxy_set_header Host $http_host;
		proxy_request_buffering off;
		proxy_max_temp_file_size 0;
		client_max_body_size ${NGINX_API_MAX_BODY_SIZE};

		# increase timeout to 300 seconds
		# https://stackoverflow.com/a/25929484
		proxy_connect_timeout       300;
		proxy_send_timeout          300;
		proxy_read_timeout          300;
		send_timeout                300;
	}

	# only in dev/staging
	# disable orthanc explorer (cannot be disabled in orthanc configs)
	location /orthanc/app/explorer.html {
		return 301 $scheme://$http_host/;
	}

	# only in dev/staging
	location /orthanc/ {
		proxy_pass http://$orthanc_upstream;
		rewrite /orthanc(.*) $1 break;
		proxy_set_header Host $http_host;
		proxy_request_buffering off;
		proxy_max_temp_file_size 0;
		client_max_body_size ${NGINX_DICOMWEB_MAX_BODY_SIZE};

		# workaround for ohif cors
		add_header 'Access-Control-Allow-Origin' '*' always;
	}

	# only in dev/staging
	location /orthanc-hospital-1/ {
		proxy_pass http://$orthanc_hospital_1_upstream;
		rewrite /orthanc-hospital-1(.*) $1 break;
		proxy_set_header Host $http_host;
		proxy_request_buffering off;
		proxy_max_temp_file_size 0;
		client_max_body_size ${NGINX_DICOMWEB_MAX_BODY_SIZE};

		# workaround for ohif cors
		add_header 'Access-Control-Allow-Origin' '*' always;
	}

	location /orthanc-hospital-2/ {
		proxy_pass http://$orthanc_hospital_2_upstream;
		rewrite /orthanc-hospital-2(.*) $1 break;
		proxy_set_header Host $http_host;
		proxy_request_buffering off;
		proxy_max_temp_file_size 0;
		client_max_body_size ${NGINX_DICOMWEB_MAX_BODY_SIZE};

		# workaround for ohif cors
		add_header 'Access-Control-Allow-Origin' '*' always;
	}
}
