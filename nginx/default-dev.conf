server {
    listen 80;
    server_name localhost;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Add SSL protocols and ciphers for better security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Rest of your existing configuration
    location /api/ {
        proxy_pass http://api-pacs:8000/;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        client_max_body_size 0;
    }

    location /orthanc/ {
        proxy_pass http://orthanc:8042;
        rewrite /orthanc(.*) $1 break;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        client_max_body_size 0;

        # workaround for ohif cors
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location /orthanc-hospital-1/ {
        proxy_pass http://orthanc-hospital-1:8042;
        rewrite /orthanc-hospital-1(.*) $1 break;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        client_max_body_size 0;

        # workaround for ohif cors
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location /orthanc-hospital-2/ {
        proxy_pass http://orthanc-hospital-2:8042;
        rewrite /orthanc-hospital-2(.*) $1 break;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        client_max_body_size 0;

        # workaround for ohif cors
        add_header 'Access-Control-Allow-Origin' '*' always;
    }
}
