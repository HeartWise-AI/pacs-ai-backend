server {
	listen 80;
	
	location / {
		proxy_pass http://api-pacs:8000;
		proxy_set_header Host $http_host;
		proxy_request_buffering off;
		proxy_max_temp_file_size 0;
		client_max_body_size 0;
	}

	location /orthanc/ {
		proxy_pass http://orthanc:8053;
		rewrite /orthanc(.*) $1 break;
		proxy_set_header Host $http_host;
		proxy_request_buffering off;
		proxy_max_temp_file_size 0;
		client_max_body_size 0;

		# workaround for ohif cors
		add_header 'Access-Control-Allow-Origin' '*' always;
	}

	location /orthanc-hospital-1/ {
		proxy_pass http://orthanc-hospital-1:8063;
		rewrite /orthanc(.*) $1 break;
		proxy_set_header Host $http_host;
		proxy_request_buffering off;
		proxy_max_temp_file_size 0;
		client_max_body_size 0;

		# workaround for ohif cors
		add_header 'Access-Control-Allow-Origin' '*' always;
	}

	location /orthanc-hospital-2/ {
		proxy_pass http://orthanc-hospital-2:8073;
		rewrite /orthanc(.*) $1 break;
		proxy_set_header Host $http_host;
		proxy_request_buffering off;
		proxy_max_temp_file_size 0;
		client_max_body_size 0;

		# workaround for ohif cors
		add_header 'Access-Control-Allow-Origin' '*' always;
	}
}