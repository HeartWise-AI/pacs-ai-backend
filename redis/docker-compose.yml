services:
  redis:
    image: redis:8.0-M02-bookworm
    container_name: redis
    restart: always
    command: ["redis-server", "/etc/redis/redis.conf"]
    networks:
      - pacs-net
    volumes:
      - ./redis.conf:/etc/redis/redis.conf
    expose:
      - "6379"

networks:
  pacs-net:
    internal: true
