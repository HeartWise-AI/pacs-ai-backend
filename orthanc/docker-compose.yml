services:
  orthanc:
    image: orthancteam/orthanc:24.12.0-full
    container_name: orthanc
    restart: unless-stopped
    ports:
      - ${ORTHANC_DICOM_PORT}:${ORTHANC_DICOM_PORT}
      # The REST API has no authentication; keep it loopback-only. Services on
      # pacs-net reach it as orthanc:8042.
      - 127.0.0.1:8042:8042
    volumes:
      - orthanc-storage:/var/lib/orthanc/db/
    environment:
      ORTHANC__NAME: "PACS_AI Orthanc"
      ORTHANC__DICOM_AET: ${ORTHANC_DICOM_AET}
      ORTHANC__DICOM_PORT: ${ORTHANC_DICOM_PORT}
      ORTHANC__DICOM_MODALITIES_IN_DATABASE: "true"
      # A calling AE title is accepted only from the Host registered for it.
      # Every DicomAlwaysAllow* option must stay false: while any is true,
      # Orthanc skips the per-association host check, and a peer from any
      # address may then use an AE title registered by two modalities.
      ORTHANC__DICOM_CHECK_MODALITY_HOST: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_ECHO: "false"
      ORTHANC__DICOM_ALWAYS_ALLOW_STORE: "false"
      ORTHANC__DATABASE_SERVER_IDENTIFIER: "PACS_AI_ORTHANC"
      ORTHANC__DICOM_WEB__PUBLIC_ROOT: "/orthanc/dicom-web/"
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__ORTHANC_EXPLORER_2__ENABLE: "false"
      ORTHANC__ORTHANC_EXPLORER_2__UI_OPTIONS__ENABLE_OPEN_IN_OHIF_VIEWER_3: "false"
      ORTHANC__ORTHANC_EXPLORER_2__UI_OPTIONS__OHIF_VIEWER_3_PUBLIC_ROOT: "http://localhost/orthanc/ohif/"
      STONE_WEB_VIEWER_PLUGIN_ENABLED: "false"
      OHIF_PLUGIN_ENABLED: "false"
      ORTHANC__OHIF: |
        {
          "RouterBasename": "/orthanc/ohif/",
          "DataSource" : "dicom-web"
        }
      ORTHANC__INGEST_TRANSCODING: "1.2.840.10008.1.2"
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__POSTGRESQL: |
        {
          "Host": "orthanc-index"
        }
      # Moves to the hospital PACS run this many at a time (a study is moved in
      # at most 4 jobs, see series_move.go). 150 opened up to
      # 150 associations at once and the PACS refused or aborted many of them.
      ORTHANC__CONCURRENT_JOBS: 4
      ORTHANC__JOBS_HISTORY_SIZE: 500
      ORTHANC__STORAGE_COMPRESSION: "false"
      ORTHANC__MEDIA_ARCHIVE_SIZE: 50
      ORTHANC__LIMIT_FIND_RESULTS: 200
      ORTHANC__KEEP_ALIVE: "true"
      ORTHANC__TCP_NO_DELAY: "true"
      VERBOSE_STARTUP: "true"
    depends_on:
      - orthanc-index

  orthanc-index:
    image: postgres:17.2
    container_name: orthanc-index
    restart: unless-stopped
    expose:
      - "5432"
    volumes: ["orthanc-index:/var/lib/postgresql/data"]
    command: -c 'max_connections=200'
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"

volumes:
  orthanc-storage:
  orthanc-index:
