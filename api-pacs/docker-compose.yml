version: "3.8"

services:
  api-pacs:
    build: .
    container_name: api-pacs
    restart: unless-stopped
    volumes:
      - ./configs/firebase/pacs-ai-firebase-admin.json:/app/build/configs/firebase/pacs-ai-firebase-admin.json
    ports:
     - ${API_URL_REST_PORT}:${API_URL_REST_PORT}
    depends_on:
      - redis

  redis:
    image: redis:latest
    restart: always
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}