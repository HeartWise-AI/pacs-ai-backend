services:
  api-pacs:
    build: .
    image: pacs-ai-backend-api-pacs:latest
    container_name: api-pacs
    restart: unless-stopped
    networks:
      - default
      - pacs-net
    expose:
      - ${API_URL_REST_PORT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - redis
      - elasticsearch

networks:
  pacs-net:
    external: true
