services:
  api-pacs:
    env_file: .env
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Toronto}
      TZ: ${APP_TIMEZONE:-America/Toronto}
    build: .
    image: pacs-ai-backend-api-pacs:latest
    container_name: api-pacs
    restart: unless-stopped
    networks:
      - pacs-net
    expose:
      - ${API_URL_REST_PORT}
    ports:
      # Keep direct host access loopback-only; public traffic must terminate TLS at Nginx.
      - 127.0.0.1:${API_URL_REST_PORT}:${API_URL_REST_PORT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - redis
      - elasticsearch
      - postgresql

networks:
  pacs-net:
    external: true
