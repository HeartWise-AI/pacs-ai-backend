services:
  api-pacs:
    build: .
    container_name: api-pacs
    restart: unless-stopped
    networks:
      - pacs-net
      - pacs-net-external
    expose:
      - ${API_URL_REST_PORT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - redis
      - elasticsearch

networks:
  pacs-net:
    internal: true
  pacs-net-external:
    external: true
