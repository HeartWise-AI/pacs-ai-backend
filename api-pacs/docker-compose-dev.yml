services:
  api-pacs:
    env_file: .env
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Toronto}
      TZ: ${APP_TIMEZONE:-America/Toronto}
    build: .
    container_name: api-pacs
    restart: unless-stopped
    networks:
      - pacs-net
    ports:
      - ${API_URL_REST_PORT}:${API_URL_REST_PORT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      redis:
        condition: service_started
      elasticsearch-setup:
        condition: service_completed_successfully
      postgresql:
        condition: service_started

networks:
  pacs-net:
    external: true
