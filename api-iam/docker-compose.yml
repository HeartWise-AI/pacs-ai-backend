version: "3.3"

services:
  api-iam:
    build: .
    container_name: api-iam
    mem_limit: "3g"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
    networks:
      - proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-iam.entrypoints=http"
      - "traefik.http.routers.api-iam.rule=Host(`${API_URL_REST}`)"
      - "traefik.http.routers.api-iam-secure.entrypoints=https"
      - "traefik.http.routers.api-iam-secure.rule=Host(`${API_URL_REST}`)"
      - "traefik.http.routers.api-iam-secure.tls=true"
      - "traefik.http.routers.api-iam-secure.tls.certresolver=http"
      - "traefik.http.routers.api-iam-secure.service=${API_NAME}"
      - "traefik.http.services.api-iam.loadbalancer.server.port=${API_URL_REST_PORT}"
      - "traefik.docker.network=proxy"
networks:
  proxy:
    external: true
