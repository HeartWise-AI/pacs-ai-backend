services:
  postgresql:
    env_file: .env
    image: postgres:17.2
    container_name: postgresql
    command: ["postgres", "-c", "timezone=${APP_TIMEZONE:-America/Toronto}", "-c", "log_timezone=${APP_TIMEZONE:-America/Toronto}"]
    cap_add:
      - SYS_NICE
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pacs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE:-db_pacs}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Toronto}
      TZ: ${APP_TIMEZONE:-America/Toronto}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5433:5432
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pacs} -d ${POSTGRES_DATABASE:-db_pacs}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
