name: Staging release validation

on:
  pull_request:
    branches: ['staging-release-*']
    types: [opened, reopened, synchronize, ready_for_review, edited, converted_to_draft, closed]

permissions:
  contents: read

concurrency:
  group: staging-backend-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'edited' || github.event.changes.base != null }}

jobs:
  unit-tests:
    # Draft staging PRs are intentionally tested. GitHub-hosted runners isolate
    # unmerged code from the protected self-hosted production network.
    if: >-
      github.event.pull_request.state == 'open' &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api-pacs/go.mod
          cache-dependency-path: api-pacs/go.sum
      - name: Test candidate commit
        working-directory: api-pacs
        env:
          GOFLAGS: -mod=readonly
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
        run: go test -race -count=1 -p 1 ./...
