name: Model runtime contract

on:
  pull_request:
    paths:
      - "model-template/**"
      - "model-examples/**"
      - "scripts/tests/test_model_resource_contract.py"
      - "scripts/tests/test_model_lifecycle.py"
      - "scripts/tests/test_deploy_model.py"
      - "scripts/tests/test_release_model.py"
      - "scripts/deploy-model.sh"
      - "scripts/release-model.py"
      - ".github/workflows/publish-model-image.yml"
      - ".github/actionlint.yaml"
      - "api-pacs/infrastructures/providers/api/dockerinference/**"
      - "api-pacs/infrastructures/providers/sdk/docker/**"
      - "api-pacs/module/inference/infrastructure/modelmanager/**"
      - "api-pacs/module/inference/infrastructure/modelupgrade/**"
      - "api-pacs/module/inference/infrastructure/containerready/**"
      - "api-pacs/module/inference/infrastructure/repository/**"
      - "api-pacs/module/inference/infrastructure/service/**"
      - "api-pacs/module/inference/domain/**"
      - "api-pacs/module/inference/application/**"
      - "api-pacs/module/inference/interfaces/**"
      - "api-pacs/interfaces/**"
      - "api-pacs/go.mod"
      - "api-pacs/go.sum"
      - ".github/workflows/model-resource-contract.yml"
  push:
    branches: [master]
    paths:
      - "model-template/**"
      - "model-examples/**"
      - "scripts/tests/test_model_resource_contract.py"
      - "scripts/tests/test_model_lifecycle.py"
      - "scripts/tests/test_deploy_model.py"
      - "scripts/tests/test_release_model.py"
      - "scripts/deploy-model.sh"
      - "scripts/release-model.py"
      - ".github/workflows/publish-model-image.yml"
      - ".github/actionlint.yaml"
      - "api-pacs/infrastructures/providers/api/dockerinference/**"
      - "api-pacs/infrastructures/providers/sdk/docker/**"
      - "api-pacs/module/inference/infrastructure/modelmanager/**"
      - "api-pacs/module/inference/infrastructure/modelupgrade/**"
      - "api-pacs/module/inference/infrastructure/containerready/**"
      - "api-pacs/module/inference/infrastructure/repository/**"
      - "api-pacs/module/inference/infrastructure/service/**"
      - "api-pacs/module/inference/domain/**"
      - "api-pacs/module/inference/application/**"
      - "api-pacs/module/inference/interfaces/**"
      - "api-pacs/interfaces/**"
      - "api-pacs/go.mod"
      - "api-pacs/go.sum"
      - ".github/workflows/model-resource-contract.yml"

permissions:
  contents: read

jobs:
  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model-template/requirements.txt
      - run: python -m pip install fastapi==0.115.5 pydantic==2.9.2 pydicom==3.0.1
      - run: >-
          python -m unittest
          scripts.tests.test_model_resource_contract
          scripts.tests.test_model_lifecycle
          scripts.tests.test_benchmark_model_resources
          scripts.tests.test_deploy_model
          scripts.tests.test_release_model
          -v
      - run: bash -n scripts/deploy-model.sh

  go-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-pacs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api-pacs/go.mod
          cache-dependency-path: api-pacs/go.sum
      - run: >-
          go test -race
          ./infrastructures/providers/api/dockerinference/...
          ./infrastructures/providers/sdk/docker/...
          ./module/inference/infrastructure/modelmanager/...
          ./module/inference/infrastructure/modelupgrade/...
          ./module/inference/infrastructure/containerready/...
          ./module/inference/infrastructure/repository/...
          ./module/inference/infrastructure/service/...
          ./module/inference/domain/...
          ./module/inference/interfaces/...
          ./interfaces/...
