name: Model resource contract

on:
  pull_request:
    paths:
      - "model-template/**"
      - "model-examples/**"
      - "scripts/tests/test_model_resource_contract.py"
      - "api-pacs/infrastructures/providers/api/dockerinference/**"
      - ".github/workflows/model-resource-contract.yml"
  push:
    branches: [master]
    paths:
      - "model-template/**"
      - "model-examples/**"
      - "scripts/tests/test_model_resource_contract.py"
      - "api-pacs/infrastructures/providers/api/dockerinference/**"
      - ".github/workflows/model-resource-contract.yml"

permissions:
  contents: read

jobs:
  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model-template/requirements.txt
      - run: python -m pip install fastapi==0.115.5 pydantic==2.9.2 pydicom==3.0.1
      - run: python -m unittest scripts.tests.test_model_resource_contract scripts.tests.test_benchmark_model_resources -v

  go-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-pacs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api-pacs/go.mod
          cache-dependency-path: api-pacs/go.sum
      - run: go test ./infrastructures/providers/api/dockerinference/...
