name: PACS AI backend self-hosted unit tests

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  unit-tests:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.sha != ''
    name: Unit tests
    environment: pacs-backend-self-hosted
    runs-on:
      group: pacs-backend-approved
      labels: [self-hosted, Linux, X64, sd4health, pacs-ai-backend, cpu]
    timeout-minutes: 45

    steps:
      - name: Revalidate the approved pull request head
        id: pull-request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          result-encoding: string
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const approvedHead = context.payload.pull_request.head.sha;
            return String(
              pullRequest.state === 'open' &&
              !pullRequest.draft &&
              pullRequest.base.ref === 'master' &&
              pullRequest.head.sha === approvedHead
            );

      - name: Check out the approved pull request commit
        if: steps.pull-request.outputs.result == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Go
        if: steps.pull-request.outputs.result == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api-pacs/go.mod
          cache-dependency-path: api-pacs/go.sum

      - name: Start isolated Redis
        if: steps.pull-request.outputs.result == 'true'
        shell: bash
        run: |
          set -euo pipefail
          redis_dir="$RUNNER_TEMP/pacs-backend-redis"
          install -d -m 0700 "$redis_dir"
          redis-server \
            --bind 127.0.0.1 \
            --protected-mode yes \
            --port 6379 \
            --save "" \
            --appendonly no \
            --daemonize yes \
            --dir "$redis_dir" \
            --pidfile "$redis_dir/redis.pid" \
            --logfile "$redis_dir/redis.log"
          for attempt in {1..20}; do
            if redis-cli -h 127.0.0.1 -p 6379 ping | grep -qx PONG; then
              exit 0
            fi
            sleep 0.25
          done
          cat "$redis_dir/redis.log"
          exit 1

      - name: Run Go unit tests with the race detector
        if: steps.pull-request.outputs.result == 'true'
        working-directory: api-pacs
        env:
          GOFLAGS: -mod=readonly
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
        run: go test -race -count=1 -p 1 ./...

      - name: Stop isolated Redis
        if: always() && steps.pull-request.outputs.result == 'true'
        shell: bash
        run: redis-cli -h 127.0.0.1 -p 6379 shutdown nosave || true
