name: Demo XA reingestion

on:
  pull_request:
    paths:
      - ".github/workflows/demo-xa-reingestion.yml"
      - ".gitignore"
      - "Makefile"
      - "docs/demo-xa-reingestion.md"
      - "scripts/.env.demo-xa.example"
      - "scripts/demo_xa_reingest.py"
      - "scripts/requirements_demo_xa_reingest.txt"
      - "scripts/tests/test_demo_xa_reingest.py"
  push:
    branches: [master]
    paths:
      - ".github/workflows/demo-xa-reingestion.yml"
      - "scripts/demo_xa_reingest.py"
      - "scripts/requirements_demo_xa_reingest.txt"
      - "scripts/tests/test_demo_xa_reingest.py"

permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements_demo_xa_reingest.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r scripts/requirements_demo_xa_reingest.txt \
            ruff==0.16.8

      - name: Lint XA reingestion code
        run: ruff check scripts/demo_xa_reingest.py scripts/tests/test_demo_xa_reingest.py

      - name: Run XA reingestion unit tests
        run: python -m unittest scripts.tests.test_demo_xa_reingest -v
