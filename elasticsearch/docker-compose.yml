services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.7.1
    container_name: elasticsearch
    labels:
      co.elastic.logs/module: elasticsearch
    volumes:
      - es_data:/usr/share/elasticsearch/data
    expose:
      - "9200"
    environment:
      - node.name=elasticsearch
      - cluster.name=docker-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in elasticsearch/.env}
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 4g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'missing authentication credentials'"]
      interval: 10s
      timeout: 10s
      retries: 120

  elasticsearch-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.7.1
    container_name: elasticsearch-setup
    restart: "no"
    volumes:
      - ./setup-security.sh:/usr/local/bin/setup-security.sh:ro
    entrypoint: ["sh", "/usr/local/bin/setup-security.sh"]
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in elasticsearch/.env}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?set KIBANA_SYSTEM_PASSWORD in elasticsearch/.env}
      - ELASTICSEARCH_API_PACS_USERNAME=${ELASTICSEARCH_API_PACS_USERNAME:-api_pacs}
      - ELASTICSEARCH_API_PACS_PASSWORD=${ELASTICSEARCH_API_PACS_PASSWORD:?set ELASTICSEARCH_API_PACS_PASSWORD in elasticsearch/.env}
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.7.1
    container_name: kibana
    labels:
      co.elastic.logs/module: kibana
    volumes:
      - kibana_data:/usr/share/kibana/data
    ports:
      # Loopback only; reach Kibana through an SSH tunnel or an authenticated proxy.
      - 127.0.0.1:5601:5601
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?set KIBANA_SYSTEM_PASSWORD in elasticsearch/.env}
    deploy:
      resources:
        limits:
          memory: 8g
        reservations:
          memory: 8g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully

volumes:
  es_data:
    driver: local
  kibana_data:
    driver: local
